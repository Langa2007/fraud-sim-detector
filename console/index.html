<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinga Fraud & SIM-Swap Intelligence Console</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <span class="shield">🛡️</span>
        <h1>Kinga <span>Intelligence Console v2</span></h1>
      </div>
      <div id="global-mode-badge" class="mode-badge">
        <span class="dot"></span> Mode: <strong id="current-mode-label">SHADOW (0% Enforce)</strong>
      </div>
    </header>

    <nav class="nav-tabs">
      <button class="tab-btn active" data-tab="cases">Case Management</button>
      <button class="tab-btn" data-tab="explorer">Decision Explorer</button>
      <button class="tab-btn" data-tab="stepup">Step-Up Orchestration</button>
      <button class="tab-btn" data-tab="rollout">Rollout & Migration</button>
      <button class="tab-btn" data-tab="rules">Rules & Policy</button>
      <button class="tab-btn" data-tab="report">Phase 2 ML Report</button>
    </nav>

    <main id="app" class="content-container"></main>

    <div id="modal-container"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
