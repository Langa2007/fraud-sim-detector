name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for JavaScript SDK syntax check
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.50.0"

      - name: Install Python ML tooling
        run: python -m pip install -r requirements-ml.txt ruff

      - name: Lint and validate Protobuf contracts
        run: |
          buf format --diff --exit-code proto
          buf lint proto
          buf build proto

      - name: Check Protobuf compatibility on pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          if git cat-file -e "origin/${BASE_BRANCH}:proto/buf.yaml" 2>/dev/null; then
            buf breaking proto --against ".git#branch=${BASE_BRANCH}"
          else
            echo "No Protobuf baseline exists on ${BASE_BRANCH}; skipping the initial compatibility comparison."
          fi

      - name: Check Go formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Vet and build Go services
        run: |
          go vet ./...
          go build ./...

      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path engine/Cargo.toml -- --check
          cargo fmt --manifest-path services/tokenizer/Cargo.toml -- --check

      - name: Lint and build Rust decision engine
        run: |
          cargo clippy --locked --manifest-path engine/Cargo.toml -- -D warnings
          cargo build --locked --release --manifest-path engine/Cargo.toml

      - name: Lint and build Rust tokenizer
        run: |
          cargo clippy --locked --manifest-path services/tokenizer/Cargo.toml -- -D warnings
          cargo build --locked --release --manifest-path services/tokenizer/Cargo.toml

      - name: Compile Python tools
        run: |
          python -m compileall -q tools
          python -m py_compile sdk/python/kinga_client.py

      - name: Check JavaScript SDK syntax
        run: |
          node --check sdk/js/index.js
          node --check console/src/main.js

      - name: Lint Python tools
        run: ruff check tools sdk/python

      - name: Check shared model feature contract
        run: python tools/ml/check_feature_contract.py

      - name: Validate model tooling command
        run: python tools/ml/train.py --help

      - name: Validate JSON contracts and policies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for root in (Path("schemas"), Path("policies"), Path("testdata"), Path("deploy")):
              for path in root.rglob("*.json"):
                  with path.open(encoding="utf-8") as source:
                      json.load(source)
          PY

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
