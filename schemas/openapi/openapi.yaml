openapi: 3.1.0
info:
  title: Kinga Shadow Assessment API
  version: 1.0.0
  description: Phase 1 read-only shadow scoring. Decisions are recommendations and never block transactions.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      security: []
      responses:
        '200': { description: Process is live }
  /readyz:
    get:
      security: []
      responses:
        '200': { description: Ready to accept assessments }
  /v1/assess:
    post:
      summary: Score one event in shadow mode
      security: [{ HMAC: [] }]
      parameters:
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
        - { in: header, name: X-Kinga-Key, required: true, schema: { type: string } }
        - { in: header, name: X-Kinga-Timestamp, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../events/assessment.schema.json' }
      responses:
        '200': { description: Decision, reasons and evidence reference }
        '401': { description: Missing or invalid credentials/signature }
        '409': { description: Idempotency key reused with a different payload }
        '422': { description: Invalid canonical event }
  /v1/evidence/verify:
    get:
      security: []
      summary: Verify the local evidence hash chain
      responses:
        '200': { description: Evidence file verified }
        '500': { description: Chain integrity failure }
  /v1/outcomes:
    post:
      summary: Submit an audited fraud review outcome for a tenant event
      description: Outcomes are tenant-scoped, idempotent by submission_id and written to an append-only hash-chained ledger.
      security: [{ HMAC: [] }]
      parameters:
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
        - { in: header, name: X-Kinga-Key, required: true, schema: { type: string } }
        - { in: header, name: X-Kinga-Timestamp, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OutcomeSubmission' }
      responses:
        '202': { description: Outcome durably recorded }
        '401': { description: Missing or invalid credentials/signature }
        '409': { description: Submission ID reused with a different outcome }
        '422': { description: Invalid outcome }
  /v1/cases:
    get:
      summary: List recent cases for the authenticated tenant
      security: [{ HMAC: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [open, assigned, released, held] } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Tenant-scoped cases ordered by latest update }
        '401': { description: Missing or invalid credentials/signature }
  /v1/cases/{caseID}/actions:
    post:
      summary: Assign, annotate, or record a human case disposition
      description: Hold and release update the advisory case only; they do not affect a transaction.
      security: [{ HMAC: [] }]
      parameters:
        - { in: path, name: caseID, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaseAction' }
      responses:
        '200': { description: Case updated }
        '404': { description: Case does not exist in this tenant }
        '409': { description: Action conflicts with the case state }
        '503': { description: Case ledger unavailable }
  /v1/cases/{caseID}/evidence:
    get:
      summary: Export case and verified evidence chain record as JSON
      security: [{ HMAC: [] }]
      parameters:
        - { in: path, name: caseID, required: true, schema: { type: string } }
      responses:
        '200': { description: Case decision, review history and verified evidence record }
        '404': { description: Case does not exist in this tenant }
        '503': { description: Evidence chain unavailable or invalid }
  /v1/cases/{caseID}/evidence/pack:
    get:
      summary: Export complete printable evidence pack document with SHA-256 seal (HTML)
      security: [{ HMAC: [] }]
      parameters:
        - { in: path, name: caseID, required: true, schema: { type: string } }
      responses:
        '200': { description: Standalone HTML evidence pack report }
        '404': { description: Case does not exist }
        '503': { description: Evidence chain unavailable or invalid }
  /v1/stepup/challenges:
    post:
      summary: Initiate an out-of-band step-up challenge
      security: [{ HMAC: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepUpInitiate' }
      responses:
        '201': { description: Step-up challenge initiated }
        '400': { description: Invalid request }
        '401': { description: Unauthorized }
  /v1/stepup/challenges/{challengeID}:
    get:
      summary: Retrieve step-up challenge status
      security: [{ HMAC: [] }]
      parameters:
        - { in: path, name: challengeID, required: true, schema: { type: string } }
      responses:
        '200': { description: Step-up challenge details }
        '404': { description: Challenge not found }
  /v1/stepup/challenges/{challengeID}/respond:
    post:
      summary: Respond to a step-up challenge (customer verification)
      security: [{ HMAC: [] }]
      parameters:
        - { in: path, name: challengeID, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved: { type: boolean }
      responses:
        '200': { description: Challenge resolved }
        '404': { description: Challenge not found }
        '409': { description: Challenge expired or already decided }
  /v1/rollout:
    get:
      summary: Get tenant staged rollout status and friction metrics
      security: [{ HMAC: [] }]
      responses:
        '200': { description: Current rollout configuration and mode }
    post:
      summary: Update staged rollout percentage, target mode or kill switch
      security: [{ HMAC: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolloutConfig' }
      responses:
        '200': { description: Rollout updated }
components:
  schemas:
    OutcomeSubmission:
      type: object
      additionalProperties: false
      required: [submission_id, tenant_event_id, evidence_id, label, reviewer, observed_at]
      properties:
        submission_id: { type: string, minLength: 1, maxLength: 128 }
        tenant_event_id: { type: string, minLength: 1, maxLength: 128 }
        evidence_id: { type: string, minLength: 1, maxLength: 160 }
        label: { type: string, enum: [confirmed_fraud, false_positive, legitimate, unknown] }
        reviewer: { type: string, minLength: 1, maxLength: 128 }
        notes: { type: string, maxLength: 512 }
        loss_kes: { type: number, minimum: 0 }
        observed_at: { type: string, format: date-time }
    CaseAction:
      type: object
      additionalProperties: false
      required: [action_id, type, reviewer]
      properties:
        action_id: { type: string, minLength: 1, maxLength: 128 }
        type: { type: string, enum: [assign, note, release, hold] }
        reviewer: { type: string, minLength: 1, maxLength: 128 }
        assignee: { type: string, maxLength: 128 }
        note: { type: string, maxLength: 1000 }
    StepUpInitiate:
      type: object
      required: [tenant_event_id, channel, language, amount, beneficiary]
      properties:
        tenant_event_id: { type: string }
        channel: { type: string, enum: [ussd_push, sms_callback, in_app] }
        language: { type: string, enum: [sw, en] }
        amount: { type: number }
        beneficiary: { type: string }
        ttl_seconds: { type: integer, default: 120 }
    RolloutConfig:
      type: object
      properties:
        target_mode: { type: string, enum: [shadow, advisory, enforce] }
        rollout_percentage: { type: integer, minimum: 0, maximum: 100 }
        kill_switch_active: { type: boolean }
        friction_ceiling: { type: number }
        friction_window: { type: integer }
  securitySchemes:
    HMAC:
      type: apiKey
      in: header
      name: X-Kinga-Signature
