services:
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-ttl"]
    expose: ["6379"]
    volumes: ["kinga-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped
  stub-scorer:
    profiles: ["latency-spike"]
    build:
      context: .
      dockerfile: tools/latency-spike/Dockerfile
    expose: ["8092"]
    healthcheck:
      test: ["CMD", "/stub-scorer", "-healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: "no"
  tokenizer:
    build:
      context: .
      dockerfile: services/tokenizer/Dockerfile
    expose: ["8091"]
    environment:
      KINGA_TOKENIZER_ADDR: 0.0.0.0:8091
      KINGA_TOKEN_KEYRING: ${KINGA_TOKEN_KEYRING:?set a JSON versioned network keyring}
      KINGA_TOKENIZER_CALLER_KEY: ${KINGA_TOKENIZER_CALLER_KEY:?set a private gateway caller key}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped
  decision-engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    expose: ["8090"]
    environment:
      KINGA_MODEL_PATH: ${KINGA_MODEL_PATH:-}
      KINGA_MODEL_CARD_PATH: ${KINGA_MODEL_CARD_PATH:-}
    volumes:
      - ./models:/app/models:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
    restart: unless-stopped
  kinga:
    build:
      context: .
      dockerfile: deploy/compose/Dockerfile
    environment:
      KINGA_LISTEN_ADDR: :8080
      KINGA_ENGINE_URL: ${KINGA_ENGINE_URL:-http://decision-engine:8090}
      KINGA_REDIS_URL: ${KINGA_REDIS_URL-redis://redis:6379/0}
      KINGA_TOKENIZER_URL: http://tokenizer:8091
      KINGA_TOKENIZER_CALLER_KEY: ${KINGA_TOKENIZER_CALLER_KEY:?set a private gateway caller key}
      KINGA_TELCO_SIMULATOR_PATH: /app/testdata/telco/simulator.json
      KINGA_API_KEYS: ${KINGA_API_KEYS:?set tenant API keys}
      KINGA_CAMARA_ENDPOINT: ${KINGA_CAMARA_ENDPOINT:-}
      KINGA_CAMARA_TOKEN: ${KINGA_CAMARA_TOKEN:-}
      KINGA_AIRTEL_CAMARA_ENDPOINT: ${KINGA_AIRTEL_CAMARA_ENDPOINT:-}
      KINGA_AIRTEL_CAMARA_TOKEN: ${KINGA_AIRTEL_CAMARA_TOKEN:-}
      KINGA_TELKOM_CAMARA_ENDPOINT: ${KINGA_TELKOM_CAMARA_ENDPOINT:-}
      KINGA_TELKOM_CAMARA_TOKEN: ${KINGA_TELKOM_CAMARA_TOKEN:-}
      KINGA_EVIDENCE_PATH: /data/evidence.jsonl
      KINGA_OUTCOME_PATH: /data/outcomes.jsonl
      KINGA_CASE_PATH: /data/cases.jsonl
      KINGA_CONSORTIUM_PATH: /data/consortium.jsonl
      KINGA_GRAPH_FEATURES_PATH: /data/graph-features.jsonl
      KINGA_CONSORTIUM_ADMIN_TOKEN: ${KINGA_CONSORTIUM_ADMIN_TOKEN:?set a private governance token}
      KINGA_CONSORTIUM_MIN_CONFIRMATIONS: ${KINGA_CONSORTIUM_MIN_CONFIRMATIONS:-2}
    ports: ["8080:8080"]
    volumes: ["kinga-evidence:/data"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    restart: unless-stopped
    depends_on:
      decision-engine:
        condition: service_started
      tokenizer:
        condition: service_started
      redis:
        condition: service_healthy
volumes:
  kinga-evidence:
  kinga-redis:
